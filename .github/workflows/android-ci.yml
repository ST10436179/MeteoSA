name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No separate Android SDK setup action: GitHub's ubuntu-latest runners already ship the
      # Android SDK cmdline-tools with licenses pre-accepted. The previously-used
      # android-actions/setup-android@v3 is unmaintained and fails outright now that Actions
      # runners force every action onto Node 24, which that action's old JS can't run on. Gradle
      # downloads any additional SDK platform/build-tools it needs during the build itself.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No local.properties is committed (it holds machine paths + API keys), so BuildConfig
      # falls back to the empty-string defaults defined in app/build.gradle.kts. That's fine
      # for CI: this job only needs the app to compile and its unit tests to pass, not to make
      # real network calls.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meteosa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
