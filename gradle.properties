# Project-wide Gradle settings.

# JVM heap for the Gradle daemon. Raise this if your PC has 16GB+ RAM (e.g. -Xmx4096m),
# lower it if you hit OutOfMemory / your PC struggles (e.g. -Xmx1536m).
org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build speed: run independent tasks/modules in parallel and reuse cached task outputs.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Use AndroidX instead of the legacy support library.
android.useAndroidX=true

# Kotlin incremental compilation (faster rebuilds after the first one).
kotlin.incremental=true

# Speeds up non-release builds by skipping PNG crunching etc. on every debug build.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
